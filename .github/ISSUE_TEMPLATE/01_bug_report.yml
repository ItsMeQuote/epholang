
name: "🐞 Bug report"
description: Report a bug in Epholang
title: "[BUG] "
labels: ["bug"]

body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I have searched existing issues and confirmed that this bug has not already been reported.
          required: true

  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please make sure you are using a supported version of Epholang.

  - type: input
    id: version
    attributes:
      label: Epholang version
      description: "Provide the exact version. Do not write 'latest'. Issues without an exact version may be closed."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Lexer
        - Parser
        - Interpreter
        - Static type checker
        - Built-in functions
        - CLI
        - Standard library
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a file...
        2. Write...
        3. Run...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code example
      description: Provide the smallest example that reproduces the issue.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: "You can attach screenshots, logs, or other files that may help us understand the problem."
    validations:
      required: false
