name: Release candidate

on:
  push:
    tags:
      - "0.2.0-alpha.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Release binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            filename: epholang-linux-x64
          - os: windows-latest
            filename: epholang-windows-x64.exe
          - os: macos-latest
            filename: epholang-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --release --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/epholang "dist/${{ matrix.filename }}"

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/epholang.exe "dist/${{ matrix.filename }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  vscode:
    name: Package VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test extension
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: epholang-vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error

  draft_release:
    name: Create draft GitHub Release
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum epholang-* > SHA256SUMS.txt

      - name: Create draft prerelease
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
          draft: true
