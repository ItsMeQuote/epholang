name: Release candidate

on:
  push:
    tags:
      - "0.2.0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Release binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            filename: epholang-linux-x64
            exe: epholang

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            filename: epholang-linux-arm64
            exe: epholang

          - name: Windows x64
            os: windows-2025
            filename: epholang-windows-x64.exe
            exe: epholang.exe

          - name: Windows ARM64
            os: windows-11-arm
            filename: epholang-windows-arm64.exe
            exe: epholang.exe

          - name: macOS Intel
            os: macos-15-intel
            filename: epholang-macos-x64
            exe: epholang

          - name: macOS Apple Silicon
            os: macos-15
            filename: epholang-macos-arm64
            exe: epholang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run release tests
        run: cargo test --all-targets --release --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test release binary
        shell: bash
        run: |
          set -euo pipefail
          "./target/release/${{ matrix.exe }}" run examples/01_hello.epho
          "./target/release/${{ matrix.exe }}" run examples/02_functions.epho
          "./target/release/${{ matrix.exe }}" run examples/03_loops.epho

      - name: Prepare binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/epholang "dist/${{ matrix.filename }}"

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/epholang.exe "dist/${{ matrix.filename }}"

      - name: Upload verified binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 30

  vscode:
    name: Package VS Code extension
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test extension
        run: npm test

      - name: Package VSIX
        run: npx --no-install vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: epholang-vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error

  draft_release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, vscode]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum epholang-* > SHA256SUMS.txt

      - name: Create draft prerelease
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
          draft: true
