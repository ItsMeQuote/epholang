name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Rust formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04

          - name: Linux ARM64
            os: ubuntu-24.04-arm

          - name: Windows x64
            os: windows-2025

          - name: Windows ARM64
            os: windows-11-arm

          - name: macOS Intel
            os: macos-15-intel

          - name: macOS Apple Silicon
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check compilation
        run: cargo check --all-targets --locked

      - name: Run unit tests
        run: cargo test --all-targets --locked

      - name: Build debug interpreter
        run: cargo build --locked

      - name: Smoke test - Hello World
        run: cargo run --locked -- run examples/01_hello.epho

      - name: Smoke test - Functions
        run: cargo run --locked -- run examples/02_functions.epho

      - name: Smoke test - Loops
        run: cargo run --locked -- run examples/03_loops.epho

      - name: Smoke test - Strings
        run: cargo run --locked -- run examples/05_strings.epho

      - name: Smoke test - Math
        run: cargo run --locked -- run examples/06_math.epho

      - name: Smoke test - Types
        run: cargo run --locked -- run examples/07_types.epho

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate VS Code extension
        run: npm test
